name: Daten aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import
      - run: npm test
      - name: Änderungen übernehmen
        run: |
          if [ -n "$(git status --porcelain daten)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daten
            git commit -m "Daten: Stand $(node -p "require('./daten/meta.json').datenstand")"
            git push
          else
            echo "Keine Änderungen."
          fi
